on: [push, pull_request]
name: CI
jobs:
  # the SPC emulator (spc-emulator.js) isn't kept in git, so it's built once, in emscripten's docker image (see build-wasm.js), and every test job uses that build
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: spc-emulator
          path: spc-emulator.js
  test:
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        node-version: [22.x, 24.x, 26.x]
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - uses: actions/download-artifact@v8
        with:
          name: spc-emulator
      - run: npm ci
      - run: npm run lint
      - run: npm run coverage
